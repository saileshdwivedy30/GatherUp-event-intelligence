name: CI Workflow
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile project
        run: find . -name "*.py" -exec sh -c 'echo "Checking {}" && python -m py_compile {}' \;
      
      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GATHERUP_EVENT_INT_SECRET }}
          export_default_credentials: true

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GATHERUP_EVENT_INT_SECRET }}

      - name: Who am I
        run: gcloud auth list

      - name: Upload DAGs to Cloud Composer
        run: |
          gsutil -m cp -r dags fetchers database ai_ml app.py gs://$GCS_BUCKET/dags/
        env:
          GCS_BUCKET: ${{ secrets.COMPOSER_BUCKET }}

      - name: Update Composer Dependencies
        run: |
          gcloud composer environments update $COMPOSER_ENV_NAME \
            --location $COMPOSER_LOCATION \
            --update-pypi-packages-from-file requirements.txt
        env:
          COMPOSER_ENV_NAME: ${{ secrets.COMPOSER_ENV_NAME }}
          COMPOSER_LOCATION: ${{ secrets.COMPOSER_LOCATION }}

       











